# SPDX-License-Identifier: Apache-2.0
#
# Bare Metal Operator, configured to take Ironic's endpoint and credentials
# from the Ironic resource (render_ironic in run.sh) managed by
# ironic-standalone-operator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/metal3-io/baremetal-operator/config/use-irso?ref=v0.14.2

images:
  - name: quay.io/metal3-io/baremetal-operator
    newTag: v0.14.2

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: ironic
    namespace: baremetal-operator-system
    behavior: merge
    literals:
      - IRONIC_NAMESPACE=baremetal-operator-system
