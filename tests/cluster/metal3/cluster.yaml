# SPDX-License-Identifier: Apache-2.0
#
# The workload cluster: one control-plane Machine and one worker Machine,
# provisioned by CAPM3 onto the test's BareMetalHosts with the node image.
# run.sh fills in the variables with `clusterctl generate yaml`. Based on
# CAPM3's clusterctl template.
#
# Hosts are chosen by their role label (HOST_ROLE_LABEL, set on the
# BareMetalHosts by run.sh): the control plane must land on the host at
# CONTROL_PLANE_HOST.
#
# No Metal3DataTemplate: the hosts get their addresses from libvirt's DHCP, and
# BMO's config drive already carries the host's name and UID, which kubeadm
# reads below ({{ ds.meta_data.* }}, rendered by cloud-init). CAPM3 matches
# the Node to its host by the metal3.io/uuid label.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${CLUSTER_NAMESPACE}
spec:
  # Kube-OVN's chart defaults (run.sh installs it with them).
  clusterNetwork:
    pods:
      cidrBlocks: ["10.16.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: Metal3Cluster
    name: ${CLUSTER_NAME}
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${CLUSTER_NAMESPACE}
spec:
  # A single control-plane node at a fixed address: no virtual IP needed.
  controlPlaneEndpoint:
    host: ${CONTROL_PLANE_HOST}
    port: 6443
  cloudProviderEnabled: false
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${CLUSTER_NAMESPACE}
spec:
  replicas: 1
  version: ${KUBERNETES_VERSION}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: Metal3MachineTemplate
        name: ${CLUSTER_NAME}-controlplane
  # kube-ovn/role=master: Kube-OVN runs OVN central on these nodes.
  kubeadmConfigSpec:
    initConfiguration:
      nodeRegistration:
        name: '{{ ds.meta_data.name }}'
        kubeletExtraArgs:
          - name: node-labels
            value: 'metal3.io/uuid={{ ds.meta_data.uuid }},kube-ovn/role=master'
    joinConfiguration:
      controlPlane: {}
      nodeRegistration:
        name: '{{ ds.meta_data.name }}'
        kubeletExtraArgs:
          - name: node-labels
            value: 'metal3.io/uuid={{ ds.meta_data.uuid }},kube-ovn/role=master'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3MachineTemplate
metadata:
  name: ${CLUSTER_NAME}-controlplane
  namespace: ${CLUSTER_NAMESPACE}
spec:
  nodeReuse: false
  template:
    spec:
      hostSelector:
        matchLabels:
          ${HOST_ROLE_LABEL}: ${CONTROL_PLANE_HOST_ROLE}
      # Nothing to wipe on a test VM that is destroyed afterwards.
      automatedCleaningMode: disabled
      image:
        url: ${IMAGE_URL}
        checksum: ${IMAGE_CHECKSUM_URL}
        checksumType: sha256
        format: qcow2
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: ${CLUSTER_NAMESPACE}
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
      nodepool: workers
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
        nodepool: workers
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: ${CLUSTER_NAME}-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: Metal3MachineTemplate
        name: ${CLUSTER_NAME}-workers
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: ${CLUSTER_NAMESPACE}
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data.name }}'
          kubeletExtraArgs:
            - name: node-labels
              value: 'metal3.io/uuid={{ ds.meta_data.uuid }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3MachineTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: ${CLUSTER_NAMESPACE}
spec:
  nodeReuse: false
  template:
    spec:
      hostSelector:
        matchLabels:
          ${HOST_ROLE_LABEL}: ${WORKER_HOST_ROLE}
      automatedCleaningMode: disabled
      image:
        url: ${IMAGE_URL}
        checksum: ${IMAGE_CHECKSUM_URL}
        checksumType: sha256
        format: qcow2
