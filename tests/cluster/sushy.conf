#
# sushy-tools (Redfish emulator) settings for the cluster test. Listen
# address and port are given on the command line by datacenter.yml.

SUSHY_EMULATOR_LIBVIRT_URI = 'qemu:///system'

# Ubuntu 24.04's ovmf package only ships the 4M variants; sushy's defaults
# (OVMF_CODE.secboot.fd, OVMF_VARS.fd) don't exist there.
SUSHY_EMULATOR_BOOT_LOADER_MAP = {
    'UEFI': {
        'x86_64': '/usr/share/OVMF/OVMF_CODE_4M.fd',
    },
    'Legacy': {
        'x86_64': None,
    },
}
SUSHY_EMULATOR_SECURE_BOOT_ENABLED_NVRAM = '/usr/share/OVMF/OVMF_VARS_4M.ms.fd'
SUSHY_EMULATOR_SECURE_BOOT_DISABLED_NVRAM = '/usr/share/OVMF/OVMF_VARS_4M.fd'

# Ironic serves the virtual media ISO over plain HTTP.
SUSHY_EMULATOR_VMEDIA_VERIFY_SSL = False

# Inserted virtual media is stored as a volume in this libvirt storage pool,
# which datacenter.yml creates (the default pool, 'default', may not exist).
SUSHY_EMULATOR_STORAGE_POOL = 'carrack-vmedia'
